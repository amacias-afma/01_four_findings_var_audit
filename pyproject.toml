[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "value_at_risk"
version = "2.1.0"
description = "Code and data manifests for a pre-registered audit of a Value-at-Risk study"
authors = [{ name = "Álvaro F. Macías Araya" }]
requires-python = ">=3.10"
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.3",
    "scipy==1.18.0",
]

[project.optional-dependencies]
# Everything needed to actually run the study end to end.
run = [
    "yfinance>=0.2.0",
    "torch>=2.0.0",
    "arch>=6.0.0",
    "matplotlib==3.11.0",
]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Make both the package (src/) and the top-level runners importable in tests without
# needing PYTHONPATH to be set by hand.
pythonpath = [".", "src"]
testpaths = ["tests"]
